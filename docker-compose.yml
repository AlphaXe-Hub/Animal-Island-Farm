services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    environment:
      MONGODB_URI: mongodb://mongo:27017/animal-island-farm
      JWT_SECRET: ${JWT_SECRET:-please-change-me-in-production}
      PORT: "3000"
    depends_on:
      mongo:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        VITE_API_BASE_URL: ""
    ports:
      - "${WEB_PORT:-18080}:80"
    depends_on:
      - api

volumes:
  mongo_data:
